[pytest]
# The repository root doubles as the ``link_budget`` package (see
# __init__.py) but calculations.py/gui.py are also imported directly as
# top-level modules (see gui.py's own `import calculations`). The default
# "prepend" import mode makes pytest try to import the root __init__.py as
# part of the package chain leading to tests/, which fails because it uses
# a relative import. importlib mode avoids that ancestor package walk.
addopts = --import-mode=importlib
testpaths = tests
